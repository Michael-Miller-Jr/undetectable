<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Undetectable</title>
    <style>
        /* --- Default / Light Mode Variables --- */
        :root {
            --bg-body: #f4f6fa;
            --bg-card: #ffffff;
            --bg-card-inner: #f0f2f8;
            --accent-purple: #7a5af8;
            --accent-green: #2ecc71;
            --text-main: #1b3a7a;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --btn-bg: #ffffff;
            --btn-border: #1b3a7a;
            --btn-text: #1b3a7a;
            --btn-hover: #f0f4ff;
            --icon-bg: transparent;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --footer-text: #9ca3af;
            --footer-link: #1b3a7a;
            --footer-link-hover: #7a5af8;
        }

        /* --- Dark Mode Variables --- */
        body.dark-mode {
            --bg-body: #13141f;
            --bg-card: #1e2030;
            --bg-card-inner: #242636;
            --accent-purple: #7a5af8;
            --accent-green: #2ecc71;
            --text-main: #ffffff;
            --text-secondary: #8b8e9f;
            --border-color: #2a2d3e;
            --btn-bg: #252840;
            --btn-border: #2a2d3e;
            --btn-text: #ffffff;
            --btn-hover: #2e3250;
            --icon-bg: transparent;
            --shadow: none;
            --footer-text: #555869;
            --footer-link: #8b8e9f;
            --footer-link-hover: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            width: 320px;
            background-color: var(--bg-body);
            color: var(--text-main);
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }

        /* --- Header Section --- */
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            position: relative;
        }

        .icon-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
        }

            .icon-container img {
                width: 48px;
                height: 48px;
            }

        .header-text {
            display: flex;
            flex-direction: column;
        }

        .title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.3px;
            margin-bottom: 4px;
            color: var(--text-main);
        }

        .status-text {
            font-size: 12px;
            color: var(--accent-green);
            font-weight: 500;
            display: flex;
            align-items: center;
        }

        .settings-icon {
            position: absolute;
            top: 0;
            right: 0;
            width: 32px;
            height: 32px;
            background-color: var(--bg-card);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 16px;
            box-shadow: var(--shadow);
            transition: background-color 0.3s;
        }

            .settings-icon:hover {
                color: var(--text-main);
            }

        /* --- Main Card: Toggle --- */
        .card {
            background-color: var(--bg-card);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
            transition: background-color 0.3s;
        }

        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toggle-info h3 {
            margin: 0 0 4px 0;
            font-size: 14px;
            font-weight: 600;
        }

        .toggle-info p {
            margin: 0;
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* Switch Styling */
        .switch {
            position: relative;
            display: inline-block;
            width: 52px;
            height: 28px;
        }

            .switch input {
                opacity: 0;
                width: 0;
                height: 0;
            }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 28px;
        }

        body.dark-mode .slider {
            background-color: #3b3e52;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-purple);
        }

            input:checked + .slider:before {
                transform: translateX(24px);
            }

        /* --- Stats Card --- */
        .stats-card {
            background-color: var(--bg-card);
            border-radius: 16px;
            padding: 0;
            margin-bottom: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: background-color 0.3s;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
        }

            .stat-row:last-child {
                border-bottom: none;
            }

        .stat-label {
            color: var(--text-secondary);
        }

        .stat-value {
            font-weight: 600;
            font-family: monospace;
            font-size: 13px;
        }

        .pill-active {
            background-color: rgba(46, 204, 113, 0.15);
            color: var(--accent-green);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

            .pill-active::before {
                content: "";
                display: block;
                width: 6px;
                height: 6px;
                background-color: var(--accent-green);
                border-radius: 50%;
            }

        /* --- Actions --- */
        .action-btn {
            width: 100%;
            background-color: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--btn-text);
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: var(--shadow);
        }

            .action-btn:hover {
                background-color: var(--btn-hover);
            }

        /* --- Footer Links --- */
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 16px;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

            .footer-links span {
                cursor: pointer;
            }

                .footer-links span:hover {
                    color: var(--text-main);
                }

        .separator {
            color: var(--border-color);
        }

        /* Bottom Status */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 0px solid var(--border-color);
            padding-top: 12px;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .bottom-status {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .green-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--accent-green);
        }

        /* --- Copyright Footer --- */
        .copyright-footer {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            text-align: center;
            font-size: 10px;
            color: var(--footer-text);
            letter-spacing: 0.2px;
        }

            .copyright-footer a {
                color: var(--footer-link);
                text-decoration: none;
                font-weight: 600;
                transition: color 0.2s;
            }

                .copyright-footer a:hover {
                    color: var(--footer-link-hover);
                    text-decoration: underline;
                }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="icon-container">
            <img src="icons/icon48.png" alt="Ghost Icon">
        </div>
        <div class="header-text">
            <div class="title">Undetectable</div>
            <div class="status-text">Protection is on</div>
        </div>
        <div class="settings-icon" id="theme-toggle" title="Toggle Theme">
            🌙
        </div>
    </div>

    <!-- Main Toggle Card -->
    <div class="card">
        <div class="toggle-row">
            <div class="toggle-info">
                <h3>Enable Protection</h3>
                <p>Stops websites from detecting your ad blocker.</p>
            </div>
            <label class="switch">
                <input type="checkbox" id="toggle" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <!-- Action Buttons -->
    <button class="action-btn" id="reloadPage">
        Reload Page
    </button>

    <button class="action-btn" id="options-btn">
        Options
    </button>

    <!-- Bottom Bar -->
    <div class="bottom-bar">
        <div class="bottom-status">
            <div class="green-dot"></div>
            <span>Active on all sites</span>
        </div>
        <span>v2.0</span>
    </div>

    <!-- Copyright Footer -->
    <div class="copyright-footer">
        &copy; <span id="copyright-year">2025</span> <a href="https://github.com/Michael-Miller-Jr" target="_blank" rel="noopener noreferrer">Michael Miller Jr.</a>
    </div>

    <script src="popup.js"></script>
</body>
</html>
